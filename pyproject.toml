[project]
name = "libby-mcp"
version = "0.1.0"
description = "MCP server for Libby / OverDrive library catalogs: search titles and compare ebook and audiobook availability across libraries."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Puneet Ghodasara" }]
requires-python = ">=3.11"
keywords = ["mcp", "libby", "overdrive", "library", "audiobooks", "ebooks"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "anyio>=4.5",
    "httpx>=0.28",
    "mcp>=2.3,<3",
]

[project.scripts]
libby-mcp = "libby_mcp.server:main"

[project.urls]
Repository = "https://github.com/puneetghodasara/libby-mcp"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: calls the real OverDrive API (run with -m live)"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
