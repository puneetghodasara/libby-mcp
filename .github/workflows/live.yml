name: Live API

# The catalog API is undocumented; this catches breaking changes on OverDrive's side.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest -m live
